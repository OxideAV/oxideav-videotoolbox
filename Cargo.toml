[package]
name = "oxideav-videotoolbox"
version = "0.0.4"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-videotoolbox"
homepage = "https://github.com/OxideAV/oxideav-videotoolbox"
authors = ["Mark Karpeles"]
description = "Apple-platform (macOS + iOS) VideoToolbox hardware decode/encode bridge for the oxideav framework — runtime-loaded via libloading on macOS, link-loaded + dlsym on iOS"
readme = "README.md"
keywords = ["videotoolbox", "macos", "ios", "hardware", "video"]
categories = ["multimedia::encoding", "multimedia::video", "hardware-support"]

[dependencies]
# `oxideav-core` is gated behind the default-on `registry` feature so
# tooling consumers can depend on `oxideav-videotoolbox` with
# `default-features = false` and avoid the framework dependency tree.
oxideav-core = { version = "0.1", optional = true }

# libloading is pulled on macOS + iOS targets — every non-Apple-platform
# build ships a stub `register()` that's a no-op (the crate body itself
# is `#![cfg(any(target_os = "macos", target_os = "ios"))]`).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libloading = "0.8"

[features]
default = ["registry"]

# Wires up the codec/encoder/decoder trait implementations against
# `oxideav-core` so the crate can plug into the `oxideav` framework
# registry. Default-on; turn off for tooling that just wants the raw
# VideoToolbox bridge bindings without the framework.
registry = ["dep:oxideav-core"]
